# DocChat — Production stack
#
# This compose adds the Qdrant vector store (Module 1).  Spin it up with:
#   docker compose up -d qdrant
# Then set QDRANT_HOST / QDRANT_PORT in /app/backend/.env (or via Settings →
# App Settings) and restart the backend.
#
# The other services (mongo / backend / frontend) live in your existing
# compose file. Merge with `docker compose -f docker-compose.yml -f docker-compose.qdrant.yml up`.

version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: docchat-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_METRICS: "true"
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  qdrant_storage:
